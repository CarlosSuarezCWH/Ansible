---
- name: Estado de servicios WordOps
  hosts: all
  tasks:
    - name: Check services
      shell: |
        for svc in nginx php8.1-fpm mysql redis-server; do
          echo "- $svc: $(systemctl is-active $svc 2>/dev/null || echo 'inactive/failed')"
        done
      register: services_status
      changed_when: false

    - name: Report
      debug:
        msg: "{{ services_status.stdout }}"
