---
- name: Estado de servicios WordOps
  hosts: all
  tasks:
    - name: Check services
      command: systemctl is-active {{ item }}
      register: wo_services
      loop:
        - nginx
        - php8.1-fpm
        - mysql
        - redis-server
      ignore_errors: true
      changed_when: false

    - name: Report
      debug:
        msg: "{{ wo_services.results | map(attribute='stdout', default='failed') | list }}"
