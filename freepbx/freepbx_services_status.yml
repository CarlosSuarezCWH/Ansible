---
- name: Estado de servicios FreePBX
  hosts: all
  tasks:
    - name: Check services
      command: systemctl is-active {{ item }}
      register: fbx_services
      loop:
        - asterisk
        - httpd
        - mariadb
      failed_when: false
      changed_when: false

    - name: Report
      debug:
        msg: |
          {% for r in fbx_services.results %}
          - {{ r.item }}: {{ r.stdout | default('failed') }}
          {% endfor %}
