---
- name: Auditoría Rápida de Flota cPanel
  hosts: cpanel_servers
  gather_facts: no
  vars:
    cpu_limit: 80
    mem_limit: 90
    disk_limit: 85

  tasks:
    - name: Recolectar métricas y servicios
      shell: |
        cpu=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1)
        ram=$(free | grep Mem | awk '{print int($3/$2 * 100)}')
        disk=$(df -h / | tail -1 | awk '{print $5}' | sed 's/%//')
        exim=$(exim -bpc 2>/dev/null || echo "0")
        
        svcs=""
        for s in httpd named mysql cpsrvd exim; do
          if /usr/local/cpanel/scripts/restartsrv_$s --status | grep -q "is running"; then
            svcs="${svcs}OK "
          else
            svcs="${svcs}FAIL "
          fi
        done
        echo "$cpu|$ram|$disk|$exim|$svcs"
      register: audit_raw
      changed_when: false

    - name: Procesar datos
      set_fact:
        c_cpu: "{{ audit_raw.stdout.split('|')[0] | string }}"
        c_ram: "{{ audit_raw.stdout.split('|')[1] | string }}"
        c_disk: "{{ audit_raw.stdout.split('|')[2] | string }}"
        c_exim: "{{ audit_raw.stdout.split('|')[3] | string }}"
        c_svcs: "{{ audit_raw.stdout.split('|')[4] | string }}"

    - name: 📊 TABLA DE CONTROL FINAL
      run_once: true
      delegate_to: localhost
      debug:
        msg: |
          ESTADO GLOBAL DE LA FLOTA
          {{ "=" * 80 }}
          {{ "HOSTNAME".ljust(25) }} | {{ "CPU%".ljust(5) }} | {{ "RAM%".ljust(5) }} | {{ "DSK%".ljust(5) }} | {{ "EXIM".ljust(6) }} | SERVICIOS (H,N,M,C,E)
          {{ "-" * 80 }}
          {% for host in ansible_play_hosts %}
          {% set h = hostvars[host] %}
          {{ host.ljust(25) }} | {{ h.c_cpu.ljust(5) }} | {{ h.c_ram.ljust(5) }} | {{ h.c_disk.ljust(5) }} | {{ h.c_exim.ljust(6) }} | {{ h.c_svcs }}
          {% endfor %}
          {{ "=" * 80 }}
