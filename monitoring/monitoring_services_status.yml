---
- name: Estado de servicios críticos por servidor
  hosts: all
  ignore_unreachable: yes
  vars:
    critical_services_linux: "sshd cron"
    critical_services_win: "Spooler"
  tasks:
    - name: Linux - Check services
      shell: |
        for svc in {{ critical_services_linux }}; do
          status=$(systemctl is-active $svc 2>/dev/null || true)
          echo "- $svc: $status"
        done
      register: srv_linux
      when: ansible_os_family != 'Windows'
      changed_when: false

    - name: Windows - Check services
      win_shell: |
        $services = "{{ critical_services_win }}" -split ' '
        foreach ($svc in $services) {
            $svc = $svc.Trim()
            $status = (Get-Service -Name $svc -ErrorAction SilentlyContinue).Status
            if (-not $status) { $status = 'NotFound' }
            Write-Output "- $svc: $status"
        }
      register: srv_win
      when: ansible_os_family == 'Windows'
      changed_when: false

    - name: Mostrar estado
      debug:
        msg: "{{ srv_linux.stdout if ansible_os_family != 'Windows' else srv_win.stdout }}"
      when: srv_linux.stdout is defined or srv_win.stdout is defined
