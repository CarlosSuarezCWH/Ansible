---
- name: Estado de servicios Nextcloud
  hosts: all
  tasks:
    - name: Check services
      command: systemctl is-active {{ item }}
      register: nc_services
      loop:
        - apache2
        - php8.1-fpm
        - mysql
        - redis-server
      failed_when: false
      changed_when: false

    - name: Report
      debug:
        msg: |
          {% for r in nc_services.results %}
          - {{ r.item }}: {{ r.stdout | default('failed') }}
          {% endfor %}
