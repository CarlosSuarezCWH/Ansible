---
- name: Estado de servicios cPanel
  hosts: all
  tasks:
    - name: Check services
      shell: |
        for svc in httpd named mysql exim pure-ftpd proftpd cpanel; do
          status=$(systemctl is-active $svc 2>/dev/null || true)
          echo "- $svc: $status"
        done
      register: services_status
      changed_when: false

    - name: Report
      debug:
        msg: "{{ services_status.stdout }}"
