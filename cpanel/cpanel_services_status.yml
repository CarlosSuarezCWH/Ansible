---
- name: Estado de servicios cPanel
  hosts: all
  tasks:
    - name: Check services
      command: systemctl is-active {{ item }}
      register: cpanel_services
      loop:
        - httpd
        - named
        - mysql
        - exim
        - pure-ftpd
        - cpanel
      failed_when: false
      changed_when: false

    - name: Report
      debug:
        msg: |
          {% for r in cpanel_services.results %}
          - {{ r.item }}: {{ r.stdout | default('failed') }}
          {% endfor %}
