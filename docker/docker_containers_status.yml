---
- name: Estado y uptime
  hosts: all
  ignore_unreachable: yes
  tasks:
    - name: Get docker ps
      command: docker ps -a --format "table {{'{{'}} .Names {{'}}'}}	{{'{{'}} .Status {{'}}'}}"
      register: d_ps
      changed_when: false

    - name: Mostrar
      debug:
        var: d_ps.stdout_lines
