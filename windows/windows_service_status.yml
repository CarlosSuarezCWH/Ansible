---
- name: Estado de servicios Windows
  hosts: all
  ignore_unreachable: yes
  vars:
    win_services: 'Spooler, W32Time'
  tasks:
    - name: Get service status
      win_shell: |
        $services = "{{ win_services }}" -split ','
        foreach ($svc in $services) {
            $svc = $svc.Trim()
            $status = (Get-Service -Name $svc -ErrorAction SilentlyContinue).Status
            if (-not $status) { $status = 'NotFound' }
            Write-Output "- $svc: $status"
        }
      register: services_status
      changed_when: false

    - name: Report
      debug:
        msg: "{{ services_status.stdout }}"
