---
- name: Estado de servicios Plesk
  hosts: all
  ignore_unreachable: yes
  tasks:
    - name: Check services
      shell: |
        for svc in psa sw-cp-server mariadb postfix dovecot named; do
          status=$(systemctl is-active $svc 2>/dev/null || true)
          echo "- $svc: $status"
        done
      register: services_status
      changed_when: false

    - name: Report
      debug:
        msg: "{{ services_status.stdout }}"
