---
- name: Estado de servicios Plesk
  hosts: all
  tasks:
    - name: Check services
      command: systemctl is-active {{ item }}
      register: plesk_services
      loop:
        - psa
        - sw-cp-server
        - mariadb
        - postfix
        - dovecot
        - named
      failed_when: false
      changed_when: false

    - name: Report
      debug:
        msg: |
          {% for r in plesk_services.results %}
          - {{ r.item }}: {{ r.stdout | default('failed') }}
          {% endfor %}
